<div class="flex gap-[var(--spacing-md)] overflow-hidden pb-[var(--spacing-sm)] min-h-[500px] items-start p-md">
  @for (col of columns; track $index; let colIndex = $index) {
    <div class="flex-shrink-0 w-[300px] flex flex-col min-h-[198px] max-h-[calc(100vh-300px)] bg-[var(--color-bg)] p-[10px] rounded-[var(--radius-md)] border-[1.5px] border-dashed border-[var(--color-border-strong)]">

      <!-- Column Header -->
      <div class="py-[var(--spacing-sm)] flex items-center justify-between mb-[var(--spacing-sm)]">
        <div class="flex items-center gap-[var(--spacing-sm)]">
          <div class="skeleton w-[18px] h-[18px] rounded-full"></div>
          <div class="skeleton w-24 h-4 rounded"></div>
        </div>
        <div class="skeleton w-6 h-5 rounded-full"></div>
      </div>

      <!-- Column Body -->
      <div class="flex-1 flex flex-col gap-[10px] overflow-hidden">
        @for (card of cards[colIndex]; track $index) {
          <!-- Card Skeleton -->
          <div class="bg-[var(--color-bg)] border border-[var(--color-border)] rounded-[var(--radius-lg)] p-[var(--spacing-md)] shadow-sm">

            <!-- Card Header -->
            <div class="flex items-start justify-between gap-[var(--spacing-sm)] mb-2">
              <div class="skeleton w-3/4 h-4 rounded"></div>
              <div class="skeleton w-12 h-3 rounded-full"></div>
            </div>

            <!-- Card Meta -->
            <div class="flex items-center gap-[var(--spacing-sm)] mb-[var(--spacing-sm)]">
              <div class="skeleton w-16 h-3 rounded"></div>
              <div class="skeleton w-20 h-3 rounded"></div>
            </div>

            <!-- Card Description -->
            <div class="flex flex-col gap-1.5 mb-[var(--spacing-sm)]">
              <div class="skeleton w-full h-2 rounded"></div>
              <div class="skeleton w-5/6 h-2 rounded"></div>
            </div>

            <!-- Card Footer -->
            <div class="flex items-center justify-between mt-3">
              <div class="flex items-center -space-x-1.5">
                <div class="skeleton w-[26px] h-[26px] rounded-full border-2 border-[var(--color-bg)] z-10"></div>
                <div class="skeleton w-[26px] h-[26px] rounded-full border-2 border-[var(--color-bg)] z-0"></div>
              </div>
              <div class="skeleton w-8 h-3 rounded"></div>
            </div>
          </div>
        }
      </div>

    </div>
  }
</div>
