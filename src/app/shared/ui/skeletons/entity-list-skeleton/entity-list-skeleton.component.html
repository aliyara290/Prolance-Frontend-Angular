<div class="flex flex-col gap-4">

  <div class="bg-[var(--color-bg)] border border-[var(--color-border)] rounded-[var(--radius-lg)] shadow-[var(--shadow-sm)] overflow-hidden">
    <div class="">

      <div class="px-5 py-4 flex flex-col justify-center h-[61px] border-b-1 border-border">
        <div class="skeleton w-18 h-[20px] rounded"></div>
      </div>

      <div class="flex items-center justify-between h-[56px] px-5">

        <div class="flex items-center gap-1.5">
          <div class="skeleton w-22 h-[30px] rounded-[var(--radius-full)]"></div>

          <div class="w-px h-4 bg-[var(--color-border)]"></div>

          <div class="skeleton w-14 h-[30px] rounded-[var(--radius-full)] opacity-50"></div>

          <div class="w-px h-4 bg-[var(--color-border)]"></div>

          <div class="skeleton w-16 h-[30px] rounded-[var(--radius-full)] opacity-50"></div>

          <div class="w-px h-4 bg-[var(--color-border)]"></div>

          <div class="skeleton w-7 h-7 rounded-[var(--radius-sm)]"></div>
        </div>

        <div class="flex items-center gap-1.5 pb-1">
          <div class="skeleton w-[116px] h-8 rounded-[var(--radius-sm)]"></div>
          <div class="skeleton w-8 h-8 rounded-[var(--radius-sm)]"></div>
          <div class="skeleton w-8 h-8 rounded-[var(--radius-full)]"></div>
        </div>

      </div>
    </div>
  </div>

  <div class="bg-[var(--color-bg)] border border-[var(--color-border)] rounded-[var(--radius-lg)] shadow-[var(--shadow-sm)] overflow-hidden">

    <div class="flex items-center justify-between px-3.5 py-2.5 border-b border-[var(--color-border)]">
      <div class="skeleton w-56 h-[34px] rounded-[var(--radius-md)]"></div>
      <div class="skeleton w-28 h-[30px] rounded-[var(--radius-sm)]"></div>
    </div>

    <table class="w-full border-collapse table-fixed text-sm">

      <colgroup>
        <col style="width: 36px" />
        <col style="width: 18%" />
        <col style="width: 16%" />
        <col style="width: 10%" />
        <col style="width: 12%" />
        <col style="width: 10%" />
        <col style="width: 15%" />
        <col style="width: 10%" />
        <col style="width: 36px" />
      </colgroup>

      <thead>
      <tr class="border-b border-[var(--color-border)]">
        <th class="px-3 py-2">
          <div class="skeleton w-3.5 h-3.5 rounded-sm"></div>
        </th>
        <th class="px-3 py-2 text-left">
          <div class="skeleton w-14 h-2.5 rounded"></div>
        </th>
        <th class="px-3 py-2 text-left">
          <div class="skeleton w-16 h-2.5 rounded"></div>
        </th>
        <th class="px-3 py-2 text-left">
          <div class="skeleton w-10 h-2.5 rounded"></div>
        </th>
        <th class="px-3 py-2 text-left">
          <div class="skeleton w-14 h-2.5 rounded"></div>
        </th>
        <th class="px-3 py-2 text-left">
          <div class="skeleton w-12 h-2.5 rounded"></div>
        </th>
        <th class="px-3 py-2 text-left">
          <div class="skeleton w-12 h-2.5 rounded"></div>
        </th>
        <th class="px-3 py-2 text-left">
          <div class="skeleton w-18 h-2.5 rounded"></div>
        </th>
        <th class="px-3 py-2"></th>
      </tr>

      <tr class="border-b border-[var(--color-border)] bg-[var(--color-bg-muted)]">
        <td class="px-3 py-1.5"></td>
        <td class="px-2 py-1.5">
          <div class="skeleton w-full h-[26px] rounded-[var(--radius-sm)]"></div>
        </td>
        <td class="px-2 py-1.5">
          <div class="skeleton w-full h-[26px] rounded-[var(--radius-sm)]"></div>
        </td>
        <td class="px-2 py-1.5">
          <div class="skeleton w-full h-[26px] rounded-[var(--radius-sm)]"></div>
        </td>
        <td class="px-2 py-1.5">
          <div class="skeleton w-full h-[26px] rounded-[var(--radius-sm)]"></div>
        </td>
        <td class="px-2 py-1.5">
          <div class="skeleton w-full h-[26px] rounded-[var(--radius-sm)]"></div>
        </td>
        <td class="px-2 py-1.5">
          <div class="skeleton w-full h-[26px] rounded-[var(--radius-sm)]"></div>
        </td>
        <td class="px-2 py-1.5"></td>
        <td class="px-2 py-1.5"></td>
      </tr>
      </thead>

      <tbody>
      @for (row of rows; track $index) {
      <tr

        class="border-b border-[var(--color-border)] last:border-b-0"
      >
        <td class="px-3 py-3.5">
          <div class="skeleton w-3.5 h-3.5 rounded-sm"></div>
        </td>
        <td class="px-3 py-3.5">
          <div class="skeleton h-3.5 rounded" style="width: 72%"></div>
        </td>
        <td class="px-3 py-3.5">
          <div class="skeleton h-3.5 rounded" style="width: 65%"></div>
        </td>
        <td class="px-3 py-3.5">
          <div class="skeleton h-3.5 rounded" style="width: 68%"></div>
        </td>
        <td class="px-3 py-3.5">
          <div class="skeleton h-3.5 rounded" style="width: 78%"></div>
        </td>
        <td class="px-3 py-3.5">
          <div class="skeleton h-3.5 rounded" style="width: 55%"></div>
        </td>
        <td class="px-3 py-3.5">
          <div class="skeleton h-3.5 rounded" style="width: 85%"></div>
        </td>
        <td class="px-3 py-3.5">
          <div class="skeleton h-3.5 rounded" style="width: 58%"></div>
        </td>
        <td class="px-3 py-3.5">
          <div class="skeleton w-4 h-3.5 rounded"></div>
        </td>
      </tr>
      }
      </tbody>

    </table>

    <div class="flex items-center justify-between px-3.5 py-2.5 border-t border-[var(--color-border)]">
      <div class="skeleton w-36 h-3 rounded"></div>
      <div class="flex items-center gap-1.5">
        <div class="skeleton w-[26px] h-[26px] rounded-[var(--radius-sm)]"></div>
        <div class="skeleton w-[26px] h-[26px] rounded-[var(--radius-sm)]"></div>
        <div class="skeleton w-[26px] h-[26px] rounded-[var(--radius-sm)]"></div>
        <div class="skeleton w-[26px] h-[26px] rounded-[var(--radius-sm)]"></div>
        <div class="skeleton w-[26px] h-[26px] rounded-[var(--radius-sm)]"></div>
      </div>
      <div class="skeleton w-14 h-[28px] rounded-[var(--radius-sm)]"></div>
    </div>

  </div>
</div>
