<div class="space-y-4 p-md">

  <!-- Header Card -->
  <div
    class="flex flex=col items-center bg-[var(--color-bg)] h-[76px] border border-[var(--color-border)] rounded-[var(--radius-lg)] shadow-[var(--shadow-sm)]">
    <div class="w-full flex items-center justify-between gap-3 px-4">
      <div class="flex items-center gap-3 px-4">
        <div class="skeleton w-7 h-7 rounded-[var(--radius-sm)]"></div>
        <div class="skeleton w-24 h-4 rounded-[var(--radius-sm)]"></div>
        <div class="w-px h-4 bg-[var(--color-border)]"></div>
        <div class="skeleton w-20 h-3.5 rounded-[var(--radius-sm)]"></div>
      </div>
      <div class="flex items-center gap-3 px-4">
        <div class="skeleton w-7 h-7 rounded-[var(--radius-sm)]"></div>
        <div class="skeleton w-7 h-7 rounded-[var(--radius-sm)]"></div>
        <div class="skeleton w-7 h-7 rounded-[var(--radius-sm)]"></div>
      </div>

    </div>
  </div>

  <!-- Tabs + Last Update -->
  <div class="flex items-center justify-between px-4 py-3
                  bg-[var(--color-bg)] border border-[var(--color-border)]
                  rounded-[var(--radius-lg)] shadow-[var(--shadow-sm)]">
    <div class="flex gap-2">
      <div class="skeleton w-20 h-8 rounded-[var(--radius-full)]"></div>
      <div class="skeleton w-18 h-8 rounded-[var(--radius-full)] opacity-50"></div>
    </div>
    <div class="skeleton w-40 h-3 rounded"></div>
  </div>

  <!-- Top Meta Row -->
  <div class="bg-[var(--color-bg)] border border-[var(--color-border)]
                  rounded-[var(--radius-lg)] shadow-[var(--shadow-sm)] overflow-hidden">
    <div class="grid grid-cols-4 divide-x divide-[var(--color-border)]">
      <div class="px-5 py-3.5" *ngFor="let cell of metaCells">
        <div class="skeleton h-2.5 rounded mb-2" [style.width]="cell.labelWidth"></div>
        <div class="skeleton h-3.5 rounded" [style.width]="cell.valueWidth"></div>
      </div>
    </div>
  </div>

  <!-- Client Information Section -->
  <div class="bg-[var(--color-bg)] border border-[var(--color-border)]
                  rounded-[var(--radius-lg)] shadow-[var(--shadow-sm)] overflow-hidden">

    <!-- Section title -->
    <div class="px-5 py-3.5 border-b border-[var(--color-border)]">
      <div class="skeleton w-36 h-4 rounded"></div>
    </div>

    <!-- Two-column field grid -->
    <div class="grid grid-cols-2 divide-x divide-[var(--color-border)]">
      <div class="divide-y divide-[var(--color-border)]">
        <div class="grid grid-cols-[160px_1fr] gap-4 items-center px-5 py-3.5"
             *ngFor="let row of clientRowsLeft">
          <div class="skeleton h-3.5 rounded" [style.width]="row.label"></div>
          <div class="skeleton h-3.5 rounded justify-self-end" [style.width]="row.value"></div>
        </div>
      </div>
      <div class="divide-y divide-[var(--color-border)]">
        <div class="grid grid-cols-[160px_1fr] gap-4 items-center px-5 py-3.5"
             *ngFor="let row of clientRowsRight">
          <div class="skeleton h-3.5 rounded" [style.width]="row.label"></div>
          <div class="skeleton h-3.5 rounded justify-self-end" [style.width]="row.value"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="bg-[var(--color-bg)] border border-[var(--color-border)]
                  rounded-[var(--radius-lg)] shadow-[var(--shadow-sm)] overflow-hidden">

    <!-- Section title -->
    <div class="px-5 py-3.5 border-b border-[var(--color-border)]">
      <div class="skeleton w-36 h-4 rounded"></div>
    </div>

    <!-- Two-column field grid -->
    <div class="grid grid-cols-2 divide-x divide-[var(--color-border)]">
      <div class="divide-y divide-[var(--color-border)]">
        <div class="grid grid-cols-[160px_1fr] gap-4 items-center px-5 py-3.5"
             *ngFor="let row of clientRowsLeft">
          <div class="skeleton h-3.5 rounded" [style.width]="row.label"></div>
          <div class="skeleton h-3.5 rounded justify-self-end" [style.width]="row.value"></div>
        </div>
      </div>
      <div class="divide-y divide-[var(--color-border)]">
        <div class="grid grid-cols-[160px_1fr] gap-4 items-center px-5 py-3.5"
             *ngFor="let row of clientRowsRight">
          <div class="skeleton h-3.5 rounded" [style.width]="row.label"></div>
          <div class="skeleton h-3.5 rounded justify-self-end" [style.width]="row.value"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Address Information Section -->
  <div class="bg-[var(--color-bg)] border border-[var(--color-border)]
                  rounded-[var(--radius-lg)] shadow-[var(--shadow-sm)] overflow-hidden">

    <div class="px-5 py-3.5 border-b border-[var(--color-border)]">
      <div class="skeleton w-40 h-4 rounded"></div>
    </div>

    <div class="grid grid-cols-2 divide-x divide-[var(--color-border)]">
      <div>
        <div class="grid grid-cols-[160px_1fr] gap-4 items-center px-5 py-3.5">
          <div class="skeleton w-9 h-3.5 rounded"></div>
          <div class="skeleton w-16 h-3.5 rounded justify-self-end"></div>
        </div>
      </div>
      <div class="divide-y divide-[var(--color-border)]">
        <div class="grid grid-cols-[160px_1fr] gap-4 items-center px-5 py-3.5">
          <div class="skeleton w-14 h-3.5 rounded"></div>
          <div class="skeleton w-18 h-3.5 rounded justify-self-end"></div>
        </div>
        <div class="grid grid-cols-[160px_1fr] gap-4 items-center px-5 py-3.5">
          <div class="skeleton w-16 h-3.5 rounded"></div>
          <div class="skeleton w-16 h-3.5 rounded justify-self-end"></div>
        </div>
      </div>
    </div>
  </div>

</div>
