<div class="border border-border-strong rounded-md">
  <div
    class="flex items-center justify-between py-4 px-5 border-b border-border-strong bg-bg rounded-tl-sm rounded-tr-sm">

    <h1 class="text-xl font-semibold text-text-muted tracking-tight shrink-0 mr-6">
      {{ title }}
    </h1>
  </div>


  <div class="flex items-center justify-between pr-5 bg-bg  rounded-bl-sm rounded-br-sm">

    <div class="flex items-center gap-2">

      <div class="flex items-center gap-0 flex-1 overflow-x-auto no-scrollbar">
        @for (tab of tabs; track tab.id) {
          <button
            type="button"
            (click)="setActiveTab(tab)"
            class="relative flex items-center gap-1.5 px-4 text-sm font-medium whitespace-nowrap  duration-150 focus:outline-none cursor-pointer"
            [class]="activeTabId === tab.id
          ? ' text-primary font-bold'
          : 'border-transparent text-text-muted hover:text-text '"
          >
            {{ tab.label }}
            @if (tab.count !== undefined) {
              <span
                class="text-xs font-semibold px-1.5 py-0.5 rounded-full"
                [class]="activeTabId === tab.id
              ? 'bg-primary text-white'
              : 'bg-bg-muted text-text-muted border border-border-strong'"
              >{{ tab.count }}</span>
            }
          </button>
          <div class="h-5 w-px bg-bar-bg mx-1"></div>
        }
      </div>

      <div class="flex items-center gap-0.5 ml-2 p-1 rounded-md bg-[var(--color-bg-muted)] border border-[var(--color-border)]">
        <button
          type="button"
          (click)="setView('list')"
          class="p-1.5 rounded cursor-pointer transition-all duration-150"
          [class]="activeView() === 'list'
            ? 'bg-[var(--color-bg)] text-[var(--color-primary)] shadow-sm border border-[var(--color-border-strong)]'
            : 'text-[var(--color-text-muted)] hover:text-[var(--color-text)] border border-transparent'"
          title="List view"
        >
          <lucide-icon
            [img]="icons.list"
            [size]="16">
          </lucide-icon>
        </button>
        <button
          type="button"
          (click)="setView('kanban')"
          class="p-1.5 rounded cursor-pointer transition-all duration-150"
          [class]="activeView() === 'kanban'
            ? 'bg-[var(--color-bg)] text-[var(--color-primary)] shadow-sm border border-[var(--color-border-strong)]'
            : 'text-[var(--color-text-muted)] hover:text-[var(--color-text)] border border-transparent'"
          title="Kanban view"
        >
          <lucide-icon
            [img]="icons.kanban"
            [size]="16">

          </lucide-icon>
        </button>
      </div>

    </div>

    <div class="flex items-center gap-2 py-3">

      <div class="flex items-center rounded overflow-hidden shadow-sm">
        <button
          type="button"
          (click)="onPrimaryAction()"
          class="px-4 py-1.5 bg-primary text-white text-sm font-semibold hover:bg-primary-hover  duration-150 focus:outline-none cursor-pointer"
        >
          {{ primaryActionLabel }}
        </button>

<!--        @if (primaryActionItems.length > 0) {-->
<!--          <app-dropdown-menu-->
<!--            [items]="primaryActionItems"-->
<!--            [splitChevron]="true"-->
<!--            (itemSelected)="onPrimaryActionSelected($event)"-->
<!--          />-->
<!--        }-->
      </div>

<!--      @if (moreActionItems.length > 0) {-->
<!--        <app-dropdown-menu-->
<!--          [items]="toDropdownItems(moreActionItems)"-->
<!--          [iconOnly]="true"-->
<!--          (itemSelected)="onMoreActionSelected($any($event))"-->
<!--        />-->
<!--      }-->

    </div>
  </div>
</div>
