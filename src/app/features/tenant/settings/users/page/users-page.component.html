<div class="text-text font-sans w-full ">

  <div class="flex overflow-hidden">
    <div class="flex flex-col w-full gap-4">

      <div class="sticky top-0 z-10 bg-[var(--color-bg)]/80 backdrop-blur-lg border-b border-[var(--color-border-strong)]">
        <div class="px-4 py-4 flex items-center justify-between gap-4">

          <div class="">
              <h1 class="text-lg font-bold text-[var(--color-text)] truncate leading-tight">Users</h1>
              <p class="text-xs text-[var(--color-text-muted)] mt-0.5 truncate">Manage workspace members and their access</p>
            </div>
  
          <div class="flex items-center gap-3">
            <!-- Invite button -->
            <button
              (click)="openInviteModal()"
              class="flex items-center gap-2 px-4 py-2 bg-[var(--color-primary)] hover:bg-[var(--color-primary-hover)] disabled:opacity-60 text-white rounded-lg text-sm font-bold cursor-pointer shadow-sm "
            >
            
              Invite User
            </button>
          </div>
        </div>
      </div>


      <!-- ── Main Split Panel ── -->
      <div class="flex min-h-[calc(100dvh-194px)] mx-4 bg-bg rounded-xl border border-border-strong shadow-sm overflow-hidden">
        <app-user-list class="flex overflow-hidden z-10"/>
        @if (selectedUser()) {
          <app-user-detail class="flex flex-1 overflow-hidden"/>
        } @else {
          <div class="flex flex-1 overflow-hidden justify-center items-center bg-bg">
            <div class="flex flex-col items-center justify-center">

              <svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                   class="mb-4 text-text-muted opacity-30">
                <path d="M4.037 4.688a.495.495 0 0 1 .651-.651l16 6.5a.5.5 0 0 1-.063.947l-6.124 1.58a2 2 0 0 0-1.438 1.435l-1.579 6.126a.5.5 0 0 1-.947.063z"/>
              </svg>
              <p class="text-sm font-medium text-text-muted">Select a user to view details</p>
            </div>
          </div>
        }
      </div>

    </div>
  </div>

  
  <app-user-modal style="display:contents"/>

</div>
