<div class="text-text font-sans w-full ">

  <div class="flex overflow-hidden">
    <div class="flex flex-col w-full gap-6">

      <div class="flex items-center justify-between shrink-0 px-2">
        <div>
          <h1 class="text-2xl font-bold text-text-inverse tracking-tight">Users</h1>
          <p class="text-sm text-text-muted mt-1.5">
            Manage workspace members and their access
          </p>
        </div>

        <div class="flex items-center gap-3">
          <!-- Invite button -->
          <button
            (click)="openInviteModal()"
            class="flex items-center gap-2 px-5 py-2.5 bg-[var(--color-primary)] hover:bg-[var(--color-primary-hover)]
                   text-white rounded-[var(--radius-md)] text-sm font-semibold
                    duration-[var(--transition-fast)] cursor-pointer shadow-[var(--shadow-sm)] hover:shadow-md transition-all"
          >
          
            Invite User
          </button>
        </div>
      </div>


      <!-- ── Main Split Panel ── -->
      <div class="flex min-h-[calc(100vh-194px)] bg-bg rounded-xl border border-border shadow-sm overflow-hidden">
        <app-user-list class="flex overflow-hidden z-10"/>
        @if (selectedUser()) {
          <app-user-detail class="flex flex-1 overflow-hidden"/>
        } @else {
          <div class="flex flex-1 overflow-hidden justify-center items-center bg-bg">
            <div class="flex flex-col items-center justify-center">

              <svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                   class="mb-4 text-text-muted opacity-30">
                <path d="M4.037 4.688a.495.495 0 0 1 .651-.651l16 6.5a.5.5 0 0 1-.063.947l-6.124 1.58a2 2 0 0 0-1.438 1.435l-1.579 6.126a.5.5 0 0 1-.947.063z"/>
              </svg>
              <p class="text-sm font-medium text-text-muted">Select a user to view details</p>
            </div>
          </div>
        }
      </div>

    </div>
  </div>

  <app-user-modal style="display:contents"/>

</div>
