@if (isLoading()) {
  <app-entity-list-skeleton></app-entity-list-skeleton>
} @else if (error()) {
  <div class="p-md">
    <app-error-message
      title="Something went wrong!"
      [message]="error() ?? 'An unexpected error occurred while fetching the project details.'"
      layout="full"
      [showRetry]="false">
    </app-error-message>
  </div>

} @else {

<div class="m-md">
  <app-module-header
    title="Invoices"
    primaryActionLabel="Create Invoice"
    (primaryAction)="createInvoice()"
    (refresh)="onRefresh()"
  />
</div>

<div class="m-md border border-border-strong rounded-md overflow-hidden bg-bg">
    <p-table
      #dt
      [value]="invoices()"
      dataKey="id"
      [rows]="10"
      [rowsPerPageOptions]="[10, 20, 50]"
      [paginator]="true"
      [globalFilterFields]="['invoiceNumber', 'status', 'billingType']"
      selectionMode="multiple"
      class="p-datatable-sm p-datatable-gridlines"
      currentPageReportTemplate="Showing {first} to {last} of {totalRecords} invoices"
      [showCurrentPageReport]="true"
    >
      <ng-template #caption>
        <div class="flex items-center justify-between gap-3 px-3 py-2.5">
          <div class="relative flex items-center">
            <svg class="w-[14px] h-[14px] text-[#a3afc4] absolute left-2.5 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
            <input
              type="text"
              [(ngModel)]="searchTerm"
              (input)="dt.filterGlobal($any($event.target).value, 'contains')"
              placeholder="Search invoices..."
              class="search-input"
            />
          </div>

          <button
            type="button"
            (click)="clearFilters()"
            class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-text border border-border-strong rounded-md bg-bg-muted hover:bg-bg-active  cursor-pointer"
          >
            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
            Clear Filters
          </button>
        </div>
      </ng-template>

      <ng-template #header>
        <tr>
          <th style="width: 3rem">
            <p-tableHeaderCheckbox />
          </th>
          <th pSortableColumn="invoiceNumber" style="min-width: 11rem">
            Invoice # <p-sortIcon field="invoiceNumber" />
          </th>
          <th pSortableColumn="status" style="min-width: 10rem">
            Status <p-sortIcon field="status" />
          </th>
          <th pSortableColumn="billingType" style="min-width: 10rem">
            Type <p-sortIcon field="billingType" />
          </th>
          <th pSortableColumn="issueDate" style="min-width: 10rem">
            Issue Date <p-sortIcon field="issueDate" />
          </th>
          <th pSortableColumn="dueDate" style="min-width: 10rem">
            Due Date <p-sortIcon field="dueDate" />
          </th>
          <th pSortableColumn="totalAmount" style="min-width: 10rem" class="text-right">
            Amount <p-sortIcon field="totalAmount" />
          </th>
          <th style="width: 4rem"></th>
        </tr>
        <tr>
          <th></th>
          <th>
            <p-columnFilter
              type="text"
              field="invoiceNumber"
              placeholder="Search invoice #"
              filterOn="input"
            />
          </th>
          <th>
            <p-columnFilter field="status" matchMode="equals" [showMenu]="false">
              <ng-template #filter let-filter="filterCallback">
                <p-select
                  [(ngModel)]="filterStatus"
                  [options]="statusOptions"
                  optionLabel="label"
                  optionValue="value"
                  placeholder="Any status"
                  [showClear]="true"
                  (onChange)="filter($event.value)"
                  style="min-width: 8rem; font-size: 0.8rem"
                >
                  <ng-template let-option #item>
                    <p-tag
                      [value]="option.label"
                      [severity]="getStatusSeverity(option.value)"
                    />
                  </ng-template>
                </p-select>
              </ng-template>
            </p-columnFilter>
          </th>
          <th>
            <p-columnFilter field="billingType" matchMode="equals" [showMenu]="false">
              <ng-template #filter let-filter="filterCallback">
                <p-select
                  [(ngModel)]="filterType"
                  [options]="typeOptions"
                  optionLabel="label"
                  optionValue="value"
                  placeholder="Any type"
                  [showClear]="true"
                  (onChange)="filter($event.value)"
                  style="min-width: 8rem; font-size: 0.8rem"
                >
                  <ng-template let-option #item>
                    <p-tag
                      [value]="option.label"
                      [severity]="getTypeSeverity(option.value)"
                    />
                  </ng-template>
                </p-select>
              </ng-template>
            </p-columnFilter>
          </th>
          <th></th>
          <th></th>
          <th></th>
          <th></th>
        </tr>
      </ng-template>

      <ng-template #body let-inv>
        <tr class="hover:bg-[#f8f9fd] ">
          <td>
            <p-tableCheckbox [value]="inv" />
          </td>
          
          <td>
            <a [routerLink]="['/app/billing/invoices', inv.id]" class="text-primary font-medium hover:underline cursor-pointer text-sm">
              {{ inv.invoiceNumber }}
            </a>
          </td>

          <td>
            <p-tag
              [value]="inv.status | titlecase"
              [severity]="getStatusSeverity(inv.status)"
            />
          </td>

          <td>
            <p-tag
              [value]="inv.billingType | titlecase"
              [severity]="getTypeSeverity(inv.billingType)"
            />
          </td>

          <td class="text-sm text-[#5e6d82]">{{ formatDate(inv.issueDate) }}</td>

          <td class="text-sm text-[#5e6d82]">{{ formatDate(inv.dueDate) }}</td>

          <td class="text-right text-sm font-medium text-[#1a2942]">
            {{ formatCurrency(inv.totalAmount, inv.currency) }}
          </td>

          <td class="text-center">
            <app-dropdown-menu
              [items]="moreActions"
              [iconOnly]="true"
              (itemSelected)="onMoreAction($event, inv)"
            />
          </td>
        </tr>
      </ng-template>

      <ng-template #emptymessage>
        <tr>
          <td colspan="8">
            <div class="flex flex-col items-center gap-3 py-16 text-[#8492a6]">
              <i class="pi pi-inbox text-5xl text-[#d9dde8]"></i>
              <span class="text-sm">No invoices found.</span>
              <button
                pButton
                type="button"
                label="Clear Filters"
                icon="pi pi-filter-slash"
                (click)="clearFilters()"
                severity="secondary"
                outlined="true"
                size="small"
              ></button>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
</div>
}
