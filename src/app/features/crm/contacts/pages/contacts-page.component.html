@if (loading()) {
  <app-entity-list-skeleton/>
} @else if (error()) {
  <div class="m-md">
    <app-error-message 
      title="Data Loading Failed" 
      [message]="error() ?? 'An unexpected error occurred while fetching the data.'" 
      layout="full"
      [showRetry]="false">
    </app-error-message>
  </div>
} @else {
  <div class="p-md mb-0">
    <app-module-header
      title="Contacts"
      primaryActionLabel="Create Contact"
      [primaryActionItems]="primaryActionItems"
      [moreActionItems]="moreActions"
      (primaryAction)="onCreate()"
      (primaryActionSelected)="onPrimaryActionSelected($event)"
      (moreActionSelected)="onMoreAction($event)"
      (refresh)="onRefresh()"
    />
  </div>

  <div class="m-md mt-0 border border-[var(--color-border)] rounded-md overflow-hidden bg-[var(--color-bg)]">
    <app-contacts-table
      [contacts]="contacts()"
      [totalCount]="totalCount()"
      (editContact)="onEditContact($event)"
    />
  </div>
}
