<app-module-header
  title="Leads"
  [tabs]="tabs"
  [activeTabId]="activeTabId()"
  primaryActionLabel="Create Lead"
  [primaryActionItems]="primaryActionItems"
  [moreActionItems]="moreActions"
  [tabMoreItems]="tabMoreItems"
  (tabChange)="onTabChange($event)"
  (primaryAction)="onCreate()"
  (primaryActionSelected)="onPrimaryActionSelected($event)"
  (moreActionSelected)="onMoreAction($event)"
  (tabMoreSelected)="onTabMore($event)"
/>

@if (loading()) {
  <div class="flex items-center justify-center py-20 bg-[var(--color-bg)] border border-[var(--color-border)] rounded-[var(--radius-lg)]">
    <div class="flex flex-col items-center gap-3">
      <svg class="animate-spin h-8 w-8 text-[var(--color-primary)]" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
      <span class="text-sm text-[var(--color-text-secondary)]">Loading leads...</span>
    </div>
  </div>
} @else if (error()) {
  <div class="flex flex-col items-center gap-4 py-16 bg-[var(--color-bg)] border border-[var(--color-border)] rounded-[var(--radius-lg)]">
    <div class="w-12 h-12 rounded-full bg-[var(--color-danger-soft)] flex items-center justify-center">
      <svg class="w-6 h-6 text-[var(--color-danger)]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
      </svg>
    </div>
    <span class="text-sm font-medium text-[var(--color-text)]">{{ error() }}</span>
  </div>
} @else {
  <div class="mt-md border border-[var(--color-border)] rounded-md overflow-hidden bg-[var(--color-bg)]">
    <app-leads-table
      [leads]="leads()"
      [totalCount]="totalCount()"
      (editLead)="onEditLead($event)"
    />
  </div>
}
