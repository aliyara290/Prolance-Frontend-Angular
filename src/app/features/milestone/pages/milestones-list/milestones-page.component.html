@if (loading()) {
  <app-entity-list-skeleton></app-entity-list-skeleton>
} @else if (error()) {
  <div class="absolute inset-0 flex items-center justify-center p-6 bg-[var(--color-bg)]">
    <div class="text-center space-y-4 max-w-sm">
      <div class="w-12 h-12 rounded-full bg-[var(--color-danger-soft)] flex items-center justify-center mx-auto">
        <svg class="w-6 h-6 text-[var(--color-danger)]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
        </svg>
      </div>
      <h3 class="text-lg font-bold text-[var(--color-text)]">Error loading milestones</h3>
      <p class="text-sm text-[var(--color-text-muted)]">{{ error() }}</p>
    </div>
  </div>
} @else {
  <div class="p-md mb-0">
    <app-module-header
      title="Milestones"
      [tabs]="tabs"
      [activeTabId]="activeTabId()"
      [view]="activeView()"
      primaryActionLabel="Create Milestone"
      [primaryActionItems]="primaryActionItems"
      [moreActionItems]="moreActions"
      [tabMoreItems]="tabMoreItems"
      (tabChange)="onTabChange($event)"
      (primaryAction)="onCreate()"
      (primaryActionSelected)="onPrimaryActionSelected($event)"
      (moreActionSelected)="onMoreAction($event)"
      (tabMoreSelected)="onTabMore($event)"
      (viewChange)="onViewChange($event)"
    />
  </div>


  <!-- List View -->
  @if (activeView() === 'list') {
    <div class="m-md mt-0 border border-border-strong rounded-md overflow-hidden bg-[var(--color-bg)]">
      @if (loading() && milestones().length === 0) {
        <app-entity-list-skeleton />
      } @else {
        <app-milestone-table
          [milestones]="milestones()"
          [loading]="loading()"
          (view)="onViewMilestone($event)"
          (edit)="onEditMilestone($event)"
          (complete)="onCompleteMilestone($event)"
          (delete)="onDeleteMilestone($event)"
        />
      }
    </div>
  }

  <!-- Kanban View -->
  @if (activeView() === 'kanban') {
    <div class="m-md mt-0 overflow-hidden">
      <app-milestone-kanban
        [milestones]="milestones()"
        [loading]="loading()"
        (view)="onViewMilestone($event)"
        (statusChange)="onStatusChange($event)"
      />
    </div>
  }
}
