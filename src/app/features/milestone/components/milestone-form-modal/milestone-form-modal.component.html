<div
  class="fixed inset-0 z-[9999] flex items-center justify-center transition-all duration-300"
  [class.pointer-events-none]="!isOpen"
  [class.opacity-0]="!isOpen"
  [class.opacity-100]="isOpen"
>
  <!-- Backdrop -->
  <div
    class="absolute inset-0 bg-black/40 backdrop-blur-sm panel-backdrop transition-opacity duration-300"
    (click)="onBackdropClick($event)"
  ></div>

  <!-- Modal Container -->
  <div
    class="absolute right-0 top-0 bottom-0 w-full max-w-[600px] bg-[var(--color-bg)] shadow-[var(--shadow-2xl)] border-l border-[var(--color-border)] flex flex-col transform transition-transform duration-300 ease-in-out"
    [class.translate-x-full]="!isOpen"
    [class.translate-x-0]="isOpen"
  >
    <!-- Header -->
    <div class="flex items-center justify-between px-6 py-4 border-b border-[var(--color-border)] bg-[var(--color-bg-subtle)] flex-shrink-0">
      <div class="flex items-center gap-3">
        <div>
          <h2 class="text-lg font-semibold text-[var(--color-text)]">
            {{ editMilestoneId ? 'Edit Milestone' : 'Create Milestone' }}
          </h2>
          <p class="text-sm text-[var(--color-text-muted)]">
            {{ editMilestoneId ? 'Update milestone details' : 'Add a new milestone to a project' }}
          </p>
        </div>
      </div>

      <button
        type="button"
        (click)="cancel()"
        class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-[var(--color-bg-hover)] text-[var(--color-text-muted)] transition-colors"
      >
        <lucide-icon [img]="icons.x" size="20"></lucide-icon>
      </button>
    </div>

    <!-- Body -->
    <div class="flex-1 overflow-y-auto p-6 scrollbar-thin">
      <form [formGroup]="milestoneForm" (ngSubmit)="submit()" class="space-y-6">

        <div class="grid grid-cols-2 gap-6">
          <!-- Project -->
          <div class="col-span-2">
            <label class="block text-sm font-medium text-[var(--color-text)] mb-1">
              Project <span class="text-[var(--color-danger)]">*</span>
            </label>
            <select
              formControlName="projectId"
              class="w-full px-3 py-2 bg-[var(--color-bg)] border border-[var(--color-border)] rounded-[var(--radius-md)] text-[var(--color-text)] focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)] focus:border-transparent disabled:opacity-50"
            >
              <option value="" disabled>Select a project</option>
              @for (project of projects(); track project.id) {
                <option [value]="project.id">{{ project.name }}</option>
              }
            </select>
          </div>

          <!-- Title -->
          <div class="col-span-2">
            <label class="block text-sm font-medium text-[var(--color-text)] mb-1">
              Title <span class="text-[var(--color-danger)]">*</span>
            </label>
            <input
              type="text"
              formControlName="title"
              placeholder="e.g. Beta Release"
              class="w-full px-3 py-2 bg-[var(--color-bg)] border border-[var(--color-border)] rounded-[var(--radius-md)] text-[var(--color-text)] focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)] focus:border-transparent"
            />
          </div>

          <!-- Status & Sequence -->
          <div>
            <label class="block text-sm font-medium text-[var(--color-text)] mb-1">
              Status <span class="text-[var(--color-danger)]">*</span>
            </label>
            <select
              formControlName="status"
              class="w-full px-3 py-2 bg-[var(--color-bg)] border border-[var(--color-border)] rounded-[var(--radius-md)] text-[var(--color-text)] focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)] focus:border-transparent"
            >
              @for (status of statusOptions; track status) {
                <option [value]="status">{{ status.replace('_', ' ') | titlecase }}</option>
              }
            </select>
          </div>

          <!-- <div>
            <label class="block text-sm font-medium text-[var(--color-text)] mb-1">
              Sequence Order <span class="text-[var(--color-danger)]">*</span>
            </label>
            <input
              type="number"
              formControlName="sequenceOrder"
              min="1"
              class="w-full px-3 py-2 bg-[var(--color-bg)] border border-[var(--color-border)] rounded-[var(--radius-md)] text-[var(--color-text)] focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)] focus:border-transparent"
            />
          </div> -->

          <!-- Dates -->
          <div>
            <label class="block text-sm font-medium text-[var(--color-text)] mb-1">
              Start Date
            </label>
            <input
              type="datetime-local"
              formControlName="startDate"
              class="w-full px-3 py-2 bg-[var(--color-bg)] border border-[var(--color-border)] rounded-[var(--radius-md)] text-[var(--color-text)] focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)] focus:border-transparent"
            />
          </div>

          <div>
            <label class="block text-sm font-medium text-[var(--color-text)] mb-1">
              Due Date
            </label>
            <input
              type="datetime-local"
              formControlName="dueDate"
              class="w-full px-3 py-2 bg-[var(--color-bg)] border border-[var(--color-border)] rounded-[var(--radius-md)] text-[var(--color-text)] focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)] focus:border-transparent"
            />
          </div>

          <!-- Progress -->
          <!-- <div class="col-span-2">
            <label class="block text-sm font-medium text-[var(--color-text)] mb-1 flex justify-between">
              <span>Progress Percentage</span>
              <span class="text-[var(--color-text-muted)]">{{ milestoneForm.get('progressPercentage')?.value || 0 }}%</span>
            </label>
            <input
              type="range"
              formControlName="progressPercentage"
              min="0"
              max="100"
              step="1"
              class="w-full accent-[var(--color-primary)]"
            />
          </div> -->

          <!-- Description -->
          <div class="col-span-2">
            <label class="block text-sm font-medium text-[var(--color-text)] mb-1">
              Description
            </label>
            <textarea
              formControlName="description"
              rows="3"
              placeholder="Provide a detailed description of the milestone objectives..."
              class="w-full px-3 py-2 bg-[var(--color-bg)] border border-[var(--color-border)] rounded-[var(--radius-md)] text-[var(--color-text)] focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)] focus:border-transparent resize-y"
            ></textarea>
          </div>
        </div>

      </form>
    </div>

    <!-- Footer -->
    <div class="flex items-center justify-end gap-3 px-6 py-4 border-t border-[var(--color-border)] bg-[var(--color-bg-subtle)] flex-shrink-0">
      <button
        type="button"
        (click)="cancel()"
        class="px-4 py-2 text-sm font-medium text-[var(--color-text)] bg-[var(--color-bg)] border border-[var(--color-border)] rounded-[var(--radius-md)] hover:bg-[var(--color-bg-hover)] transition-colors focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)] focus:ring-offset-1"
        [disabled]="submitting()"
      >
        Cancel
      </button>

      <button
        type="button"
        (click)="submit()"
        class="px-4 py-2 text-sm font-medium text-white bg-[var(--color-primary)] border border-transparent rounded-[var(--radius-md)] hover:bg-[var(--color-primary-hover)] transition-colors focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)] focus:ring-offset-1 flex items-center gap-2"
        [disabled]="milestoneForm.invalid || submitting()"
      >
        @if (submitting()) {
          <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Saving...
        } @else {
          {{ editMilestoneId ? 'Save Changes' : 'Create Milestone' }}
        }
      </button>
    </div>
  </div>
</div>
