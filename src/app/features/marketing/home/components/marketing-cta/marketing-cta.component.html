<section class="py-[120px] relative overflow-hidden m-[var(--spacing-lg)] rounded-[var(--radius-3xl)] lg:rounded-[40px]">
  <!-- Beautiful deep gradient background -->
  <div class="absolute inset-0 bg-gradient-to-br from-[#0f172a] via-[#1e1b4b] to-[var(--color-primary)] opacity-95"></div>
  
  <!-- Glowing abstract shapes -->
  <div class="absolute top-0 right-0 w-[500px] h-[500px] bg-[var(--color-primary)] opacity-40 rounded-full blur-[100px] pointer-events-none translate-x-1/3 -translate-y-1/3"></div>
  <div class="absolute bottom-0 left-0 w-[400px] h-[400px] bg-[#8b5cf6] opacity-30 rounded-full blur-[80px] pointer-events-none -translate-x-1/3 translate-y-1/3"></div>

  <!-- Noise overlay for premium texture -->
  <div class="absolute inset-0 opacity-[0.03] mix-blend-overlay pointer-events-none" style="background-image: url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.65%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22/%3E%3C/svg%3E');"></div>

  <div class="max-w-[800px] mx-auto px-[var(--spacing-lg)] text-center relative z-10 flex flex-col items-center">
    <h2 class="text-[40px] md:text-[56px] font-[var(--font-bold)] text-white mb-[var(--spacing-md)] tracking-tighter leading-[1.1]">
      Ready to streamline <br class="hidden sm:block"/> your workflow?
    </h2>
    <p class="text-[var(--text-lg)] text-blue-100/80 font-[var(--font-normal)] max-w-[600px] mb-[var(--spacing-2xl)] leading-relaxed">
      Join thousands of companies using Prolance to manage their projects, align their teams, and ship faster than ever.
    </p>
    
    <div class="flex flex-col sm:flex-row items-center justify-center gap-[var(--spacing-md)] w-full sm:w-auto">
      <a (click)="register()" class="cursor-pointer w-full sm:w-auto bg-white hover:bg-gray-50 text-[var(--color-text)] font-[var(--font-semibold)] text-[var(--text-md)] px-[var(--spacing-2xl)] py-[18px] rounded-full transition-all duration-[var(--transition-fast)] shadow-xl hover:shadow-2xl hover:-translate-y-1 flex items-center justify-center gap-2 group">
        Start 14-day free trial
        <svg class="w-5 h-5 text-[var(--color-text)] group-hover:translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
        </svg>
      </a>
      <a href="#sales" class="w-full sm:w-auto bg-white/10 hover:bg-white/20 backdrop-blur-md border border-white/20 text-white font-[var(--font-medium)] text-[var(--text-md)] px-[var(--spacing-2xl)] py-[18px] rounded-full transition-all duration-[var(--transition-fast)] flex items-center justify-center hover:-translate-y-1">
        Contact Sales
      </a>
    </div>
  </div>
</section>
