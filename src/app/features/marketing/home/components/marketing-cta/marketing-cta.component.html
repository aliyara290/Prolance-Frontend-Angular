<section class="py-[100px] bg-[var(--color-primary)] relative overflow-hidden">
  <!-- Decor -->
  <div class="absolute top-0 right-0 w-[400px] h-[400px] bg-white opacity-10 rounded-[var(--radius-full)] blur-[80px] pointer-events-none translate-x-1/2 -translate-y-1/2"></div>
  <div class="absolute bottom-0 left-0 w-[300px] h-[300px] bg-black opacity-10 rounded-[var(--radius-full)] blur-[60px] pointer-events-none -translate-x-1/2 translate-y-1/2"></div>

  <div class="max-w-[800px] mx-auto px-[var(--spacing-lg)] text-center relative z-10">
    <h2 class="text-[var(--text-3xl)] md:text-[var(--text-4xl)] font-[var(--font-bold)] text-white mb-[var(--spacing-md)] tracking-tight">
      Ready to streamline your workflow?
    </h2>
    <p class="text-[var(--text-lg)] text-[var(--color-primary-soft)] font-[var(--font-normal)] mb-[var(--spacing-xl)] leading-relaxed">
      Join thousands of companies using Prolance to manage their projects and scale their teams.
    </p>
    <div class="flex flex-col sm:flex-row items-center justify-center gap-[var(--spacing-md)]">
      <a routerLink="/register" class="w-full sm:w-auto bg-white hover:bg-gray-50 text-[var(--color-primary)] font-[var(--font-semibold)] text-[var(--text-md)] px-[var(--spacing-xl)] py-[14px] rounded-[var(--radius-md)] transition-[var(--transition-fast)] shadow-[var(--shadow-md)]">
        Start 14-day free trial
      </a>
      <a href="#sales" class="w-full sm:w-auto bg-transparent border border-[var(--color-primary-soft)] hover:bg-[rgba(255,255,255,0.1)] text-white font-[var(--font-medium)] text-[var(--text-md)] px-[var(--spacing-xl)] py-[14px] rounded-[var(--radius-md)] transition-[var(--transition-fast)]">
        Contact Sales
      </a>
    </div>
  </div>
</section>
