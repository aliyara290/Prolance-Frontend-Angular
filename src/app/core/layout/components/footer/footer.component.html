<div class="flex items-center gap-4 w-full pr-2 pl-0">
  <div class="flex-1 flex items-center">
    <!-- Log Time Button -->
    <button (click)="openLogTime()"
            class="flex items-center gap-1.5 text-text-muted hover:text-primary-hover cursor-pointer pl-1">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-timer-icon lucide-timer"><line x1="10" x2="14" y1="2" y2="2"/><line x1="12" x2="15" y1="14" y2="11"/><circle cx="12" cy="14" r="8"/></svg>
      <span class="font-medium">Log Time</span>
    </button>
  </div>

  <div class="flex items-center gap-4">
    <a href="#" class="hover:text-[var(--color-primary)] flex items-center gap-1">
      <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
           class="lucide lucide-book-open-text-icon lucide-book-open-text">
        <path d="M12 7v14"/>
        <path d="M16 12h2"/>
        <path d="M16 8h2"/>
        <path
          d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>
        <path d="M6 12h2"/>
        <path d="M6 8h2"/>
      </svg>
      <span>Documentation</span>
    </a>
    <a href="#" class="hover:text-[var(--color-primary)] flex items-center gap-1">
      <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
           class="lucide lucide-headset-icon lucide-headset">
        <path
          d="M3 11h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-5Zm0 0a9 9 0 1 1 18 0m0 0v5a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3Z"/>
        <path d="M21 16v2a4 4 0 0 1-4 4h-5"/>
      </svg>
      <span>Support</span>
    </a>

    <div class="flex items-center gap-1.5">
      <div class="w-2 h-2 rounded-full bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.6)]"></div>
      <span>All systems operational</span>
    </div>
  </div>
</div>

<app-time-entry-dialog
  *ngIf="isDialogOpen()"
  [isOpen]="isDialogOpen()"
  [projectOptions]="projectOptions()"
  [isSubmitting]="isSubmitting()"
  (closed)="closeDialog()"
  (submitted)="onSubmitted($event)">
</app-time-entry-dialog>
