<header class="h-[60px] bg-card border-b border-border flex items-center justify-between px-4 z-50 sticky top-0">

  <div class="flex items-center gap-4 flex-1">
    <!-- Mobile Sidebar Toggle -->
    <button
      (click)="layoutState.toggleMobileDrawer()"
      class="md:hidden p-2 rounded text-[#5e6d82] hover:text-[#223555] hover:bg-gray-100 transition-colors">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>
  </div>

  <!-- Right Actions -->
  <div class="flex items-center gap-1 ml-4">
    <!-- Add / Plus Icon -->
    <button type="button" class="flex justify-center items-center w-9 h-8 hover:bg-bg-hover text-text-muted hover:text-primary rounded-sm transition-colors cursor-pointer">
      <lucide-icon [img]="icons.plus" size="20"></lucide-icon>
    </button>

    <button type="button" class="flex justify-center items-center w-9 h-8 hover:bg-bg-hover text-text-muted hover:text-primary rounded-sm transition-colors cursor-pointer">
      <lucide-icon [img]="icons.settings" size="20"></lucide-icon>
    </button>

    <button type="button" class="flex justify-center items-center w-9 h-8 hover:bg-bg-hover text-text-muted hover:text-primary rounded-sm transition-colors cursor-pointer">
      <lucide-icon [img]="icons.calendar" size="20"></lucide-icon>
    </button>

    <div class="h-5 w-px bg-bar-bg mx-1"></div>

    <!-- User Menu -->
    <app-user-menu />
  </div>
</header>
