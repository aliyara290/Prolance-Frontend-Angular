<header class="h-[60px] bg-white border-b border-[#e5e7eb] flex items-center justify-between px-4 z-sticky sticky top-0">

  <div class="flex items-center gap-4 flex-1">
    <!-- Mobile Sidebar Toggle -->
    <button
      (click)="layoutState.toggleMobileDrawer()"
      class="md:hidden p-2 rounded text-[#5e6d82] hover:text-[#223555] hover:bg-gray-100 transition-colors">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>

    <!-- Current Module Title (Placeholder for Zoho style title) -->
    <div class="hidden md:block text-lg font-medium text-[#223555]">
      Leads
    </div>

  </div>

  <!-- Right Actions -->
  <div class="flex items-center gap-3 ml-4">
    <!-- Add / Plus Icon -->
    <app-icon-wrapper [icon]="icons.plus"/>

    <app-icon-wrapper [icon]="icons.settings"/>

    <app-icon-wrapper [icon]="icons.calendar"/>

    <div class="h-5 w-px bg-[#e5e7eb] mx-1"></div>

    <!-- User Menu -->
    <app-user-menu />
  </div>
</header>
