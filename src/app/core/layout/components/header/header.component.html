  <div>
    <app-workspace-switcher class="w-full"/>
  </div>

  <!-- Right Actions -->
  <div class="flex items-center gap-2 ml-4">

    <!-- Quick Actions -->
    <div class="relative inline-block text-left">
      <button type="button"
              (click)="toggleQuickActions($event)"
              class="flex justify-center items-center w-7.5 h-7.5 border-1 border-primary hover:bg-primary text-primary hover:text-white rounded-sm  cursor-pointer transition-colors focus:outline-none">
        <lucide-icon [img]="icons.plus" size="20"></lucide-icon>
      </button>

      @if (isQuickActionsOpen()) {
        <div class="absolute -right-3 top-11 mt-1 w-[240px] rounded-lg border border-border-strong bg-bg shadow-lg py-2 z-[100]">
          <!-- Upward Caret -->
          <div class="absolute -top-[7px] right-[21px] w-3 h-3 bg-bg border-l border-t border-border-strong rotate-45 z-0"></div>

          <div class="relative z-10">
            <div class="px-5 pb-3 pt-1 text-xs font-semibold text-text-muted tracking-widest border-b border-border-strong mb-2 uppercase">
              Global Actions
            </div>

            <div class="px-2 max-h-[370px] overflow-y-auto no-scrollbar">
              @for (action of quickActions; track action.label) {
                <button
                  type="button"
                  (click)="navigateQuickAction(action.route)"
                  class="flex w-full items-center gap-3 px-3 py-2 text-left text-[15px] font-medium text-text-inverse hover:bg-bg-hover rounded-md transition-colors cursor-pointer mb-1"
                >
                  <div class="w-8 h-8 rounded-lg flex items-center justify-center shrink-0 text-white shadow-sm" [class]="action.color">
                    <lucide-icon [img]="action.icon" size="16"></lucide-icon>
                  </div>
                  {{ action.label }}
                </button>
              }
            </div>
          </div>
        </div>
      }
    </div>

    <a
      #rla="routerLinkActive"
      [routerLink]="'/app/settings'"
      routerLinkActive="!bg-bg-active !text-primary"
      [class.pointer-events-none]="rla.isActive"
      [class.cursor-default]="rla.isActive"
      class="flex justify-center items-center w-7.5 h-7.5 rounded-sm
         text-text-muted hover:bg-bg-hover hover:text-primary
         cursor-pointer"
    >
      <lucide-icon [img]="icons.settings" size="20"></lucide-icon>
    </a>

    <a
      #rla="routerLinkActive"
      [routerLink]="'/app/calendar'"
      routerLinkActive="!bg-bg-active !text-primary"
      [class.pointer-events-none]="rla.isActive"
      [class.cursor-default]="rla.isActive"
      class="flex justify-center items-center w-7.5 h-7.5 rounded-sm
         text-text-muted hover:bg-bg-hover hover:text-primary
         cursor-pointer"
    >

      <lucide-icon [img]="icons.calendar" size="20"></lucide-icon>

    </a>

    <button
      class="flex justify-center items-center w-7.5 h-7.5 rounded-sm
         text-text-muted
         cursor-pointer"
    >

      <lucide-icon [img]="icons.notification" size="20"></lucide-icon>

    </button>

    <div class="h-5 w-px bg-bar-bg mx-1"></div>

    <!-- User Menu -->
    <app-user-menu/>
  </div>
</header>
